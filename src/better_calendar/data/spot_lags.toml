# Currency settlement lags, in business days (CLAUDE.md §7.4).
#
# These are **money-market / deposit** spot conventions: how many business days after
# the trade date a deposit in this currency settles. Sterling settles same-day, the
# Canadian dollar next day, most of the rest at T+2.
#
# They are NOT FX spot conventions, which are a property of the *pair* rather than of a
# single currency — GBP/USD is T+2 even though a GBP deposit is T+0, and USD/CAD is T+1.
# If you need FX spot, take the pair's convention from your own reference data and pass
# the lag explicitly.
#
# Conventions do move. This table is data precisely so that a desk can correct a row
# without touching code; the values below are the widely quoted defaults, not gospel.

[lags]
GBP = 0
TRY = 0
CAD = 1

AUD = 2
CHF = 2
CNH = 2
CZK = 2
DKK = 2
EUR = 2
HKD = 2
HUF = 2
ILS = 2
JPY = 2
MXN = 2
NOK = 2
NZD = 2
PLN = 2
SEK = 2
SGD = 2
USD = 2
ZAR = 2
