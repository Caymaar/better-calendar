name: Snapshot drift

# CLAUDE.md §5.5, and it is a hard requirement rather than a nice-to-have. Upstream
# holiday packages ship corrections continuously. Without this job, upgrading one of them
# would move a settlement date with nobody deciding to (I8). With it, the change arrives
# as a pull request a human reads and merges — and because the snapshot is one ISO date
# per line, that review shows the moved dates directly.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, early
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install with the latest upstreams
        run: uv sync --all-extras --upgrade

      - name: Check for drift
        id: check
        run: uv run better-calendar diff | tee drift.txt
        continue-on-error: true

      - name: Regenerate
        if: steps.check.outcome == 'failure'
        run: uv run better-calendar snapshot --provider all

      - name: Open a pull request
        if: steps.check.outcome == 'failure'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: snapshot/drift
          title: "chore(data): upstream holiday data moved"
          commit-message: "chore(data): regenerate snapshots from the latest upstreams"
          body-path: drift.txt
          labels: snapshot-drift
