name: CI

# Pushes to main are covered by release.yml, which gates publication on the same checks.
# Running both there would duplicate every job.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor (CLAUDE.md §1); 3.13 catches deprecations early.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python-version }} --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (incl. doctests)
        run: uv run pytest -q

  no-pandas:
    # I6 allows degrading to numpy; §14 forbids importing pandas at import time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --no-dev
      - run: uv run --no-dev python -c "import sys, better_calendar; assert 'pandas' not in sys.modules"

  bare-install:
    # The snapshot ships in the wheel and is read with numpy alone: a bare install must
    # answer for XNYS without any provider present (I8, §5.3).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --no-dev
      - run: |
          uv run --no-dev python - <<'PY'
          import sys
          import better_calendar as bcal
          assert bcal.offset("2026-07-02", 1, cal="XNYS") == "2026-07-06"   # 3 July closed
          assert not bcal.is_bday("2026-04-06", cal="fin:TARGET2")          # Easter Monday
          assert len(bcal.list()) > 400
          for provider in ("exchange_calendars", "holidays", "QuantLib", "workalendar"):
              assert provider not in sys.modules, provider
          PY

  wheel:
    # The snapshot has to survive packaging, and a bare install has to answer without any
    # provider, without pandas, and without a config reader.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv venv --python 3.9 bare
      - run: VIRTUAL_ENV=bare uv pip install dist/*.whl
      - run: |
          ./bare/bin/python - <<'PY'
          import sys
          from datetime import date
          import better_calendar as bcal
          for forbidden in ("pandas", "exchange_calendars", "holidays", "QuantLib", "workalendar", "yaml"):
              assert forbidden not in sys.modules, forbidden
          assert bcal.offset("2026-07-02", 1, cal="XNYS") == "2026-07-06"
          assert bcal.add_tenor("2026-02-28", "1M", eom=True) == "2026-03-31"
          assert date(2026, 7, 31) + bcal.BDay(5) == date(2026, 8, 7)
          assert bcal.session_of("2026-07-31 23:30+00:00", tz="Europe/Paris") == date(2026, 8, 1)
          assert len(bcal.list()) > 400
          PY

  notebooks:
    # The notebooks are documentation that runs, so CI runs it. Outputs are not compared —
    # only that every cell still executes against the current library.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run python tools/run_notebooks.py

  drift-on-demand:
    # The scheduled run lives in snapshot-drift.yml; this one guards pull requests that
    # touch the providers or the committed data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Snapshot matches the pinned upstreams
        run: uv run better-calendar diff
