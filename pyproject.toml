[project]
name = "better-calendar"
version = "1.0.0"
description = "Business-day arithmetic, calendar algebra and schedule generation, in one place."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Caymaar", email = "julesmourgues@gmail.com" }
]
keywords = ["calendar", "business-days", "holidays", "finance", "schedule"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.scripts]
better-calendar = "better_calendar.cli:main"

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
exchange = ["exchange-calendars>=4.5"]
holidays = ["holidays>=0.40"]
quantlib = ["QuantLib>=1.32"]
workalendar = ["workalendar>=17.0"]
# Reading the §5.6 organisation config: YAML always needs PyYAML, and TOML needs
# tomli below 3.11, where tomllib is not yet in the standard library.
config = ["PyYAML>=6.0", "tomli>=2.0; python_version < '3.11'"]
all = [
    "pandas>=2.0",
    "exchange-calendars>=4.5",
    "holidays>=0.40",
    "QuantLib>=1.32",
    "workalendar>=17.0",
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[dependency-groups]
notebooks = [
    "jupyter>=1.0",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.5",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    {include-group = "notebooks"},
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py39"
line-length = 96
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "SIM",         # simplify
    "RUF",         # ruff-specific
    "D",           # pydocstyle
    "ANN",         # annotations
    "PT",          # pytest style
    "TID",         # tidy imports
]
ignore = [
    "D105",    # magic methods need no docstring
    "D107",    # __init__ documented on the class
    "ANN401",  # `Any` is unavoidable in the type-preserving dispatcher
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# `bcal.list` deliberately shadows the builtin (CLAUDE.md §13).
"src/better_calendar/__init__.py" = ["A001", "A004"]
"tests/**" = ["D", "ANN"]
"tools/**" = ["ANN"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src", "tests", "tools"]
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[[tool.mypy.overrides]]
# `tools/` are developer scripts driving untyped Jupyter APIs; the library contract does
# not run through them, so calling into nbformat is not a hole worth annotating around.
module = ["tools.*", "run_notebooks"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# Tests exercise the API as callers do; annotating every `-> None` adds noise, not safety.
# Everything else about strict mode (arg types, returns, unreachable code) still applies.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# pandas is an optional extra reached through a lazy accessor; stubbing it would imply a
# hard dependency we do not have, and pandas-stubs does not support our 3.9 floor.
module = ["pandas", "pandas.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
# Provider upstreams are build-time only and ship no stubs; they are reached through
# `require_upstream`, which hands back an untyped module on purpose.
module = [
    "yaml",
    "tomli",
    "exchange_calendars", "exchange_calendars.*",
    "holidays", "holidays.*",
    "QuantLib", "QuantLib.*",
    "workalendar", "workalendar.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "src"]
addopts = "--doctest-modules --strict-markers"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
markers = [
    "oracle: cross-validation against an authoritative upstream (QuantLib, exchange-calendars)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["better_calendar"]
branch = true
